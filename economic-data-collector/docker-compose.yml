services:
  db:
    image: timescale/timescaledb:2.17.2-pg16
    container_name: econ_data_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: econ
      POSTGRES_PASSWORD: econ
      POSTGRES_DB: econdata
    ports:
      - "5433:5432"
    volumes:
      - econ_data_pg:/var/lib/postgresql/data
      - ./db/migrations:/docker-entrypoint-initdb.d:ro

volumes:
  econ_data_pg:
